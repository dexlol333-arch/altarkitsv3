name: Build AltarKits

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build with Maven
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -n 1)
          if [ -z "$POM" ]; then echo "No pom.xml found in the repo - upload it!"; exit 1; fi
          echo "Using $POM"
          mvn -B package --file "$POM"
      - uses: actions/upload-artifact@v4
        with:
          name: AltarKits
          path: "**/target/*.jar"
